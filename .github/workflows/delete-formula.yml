name: delete formula
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to delete.
        required: true
        type: string
      dry-run:
        description: Show the deletion without committing.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delete:
    permissions:
      contents: write
    uses: releaseway/homebrew-actions/.github/workflows/tap-delete.yml@7e351bd4f3ea1aa0070e4d6556bb5130df2401e6 # v0.5.3
    with:
      formula: ${{ inputs.formula }}
      dry-run: ${{ inputs.dry-run }}
