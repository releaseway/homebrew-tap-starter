name: delete formula
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to delete.
        required: true
        type: string
      dry-run:
        description: Show the deletion without committing.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delete:
    permissions:
      contents: write
    uses: releaseway/homebrew-actions/.github/workflows/tap-delete.yml@b947bedda8122de8b5c13b41416c3651a7841ae1 # v0.3.4
    with:
      formula: ${{ inputs.formula }}
      dry-run: ${{ inputs.dry-run }}
