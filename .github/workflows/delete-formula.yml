name: delete formula
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to delete.
        required: true
        type: string
      dry-run:
        description: Show the deletion without committing.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delete:
    permissions:
      contents: write
    uses: releaseway/homebrew-actions/.github/workflows/tap-delete.yml@5ff7e261e32542dde8902ef16483405c2bf4ca12 # v0.4.0
    with:
      formula: ${{ inputs.formula }}
      dry-run: ${{ inputs.dry-run }}
