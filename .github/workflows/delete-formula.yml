name: delete formula
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to delete.
        required: true
        type: string
      dry-run:
        description: Show the deletion without committing.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delete:
    permissions:
      contents: write
    uses: releaseway/homebrew-actions/.github/workflows/tap-delete.yml@8fe42d36a7f93a3c399461efbe571fc695d4cdc6 # v0.4.3
    with:
      formula: ${{ inputs.formula }}
      dry-run: ${{ inputs.dry-run }}
