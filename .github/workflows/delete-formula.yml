name: delete formula
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to delete.
        required: true
        type: string
      dry-run:
        description: Show the deletion without committing.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delete:
    permissions:
      contents: write
    uses: releaseway/homebrew-actions/.github/workflows/tap-delete.yml@d3f1522212aca4702a32805159b0bd3e88561986 # v0.4.1
    with:
      formula: ${{ inputs.formula }}
      dry-run: ${{ inputs.dry-run }}
