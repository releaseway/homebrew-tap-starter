name: delete formula
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to delete.
        required: true
        type: string
      dry-run:
        description: Show the deletion without committing.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  delete:
    permissions:
      contents: write
    uses: releaseway/homebrew-actions/.github/workflows/tap-delete.yml@c849a6bcf851c72cdf01d6fc50d9cf823dbc537e # v0.5.0
    with:
      formula: ${{ inputs.formula }}
      dry-run: ${{ inputs.dry-run }}
